<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initial Admin Registration | Goddy Graphix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0A2540] min-h-screen flex items-center justify-center p-4 font-['Plus_Jakarta_Sans']">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden">
        <div class="bg-[#F5A623] p-8 text-center">
            <h1 class="font-['Montserrat'] text-2xl text-[#0A2540] font-extrabold uppercase tracking-tight">Setup <span class="text-white">Admin</span></h1>
            <p class="text-[#0A2540]/70 text-sm mt-1 font-medium">Create your first account to get started</p>
        </div>
        
        <div class="p-8">
            <form id="registerForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Desired Username</label>
                    <input type="text" id="username" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 focus:ring-2 focus:ring-[#F5A623] outline-none transition" placeholder="e.g. admin" required>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-2">Strong Password</label>
                    <input type="password" id="password" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-3 px-4 focus:ring-2 focus:ring-[#F5A623] outline-none transition" placeholder="Min. 12 characters" required>
                </div>
                <div id="feedback" class="hidden text-xs font-bold p-3 rounded-lg text-center"></div>
                <button type="submit" id="submitBtn" class="w-full bg-[#0A2540] hover:bg-[#071A2E] text-white font-bold py-4 rounded-xl shadow-lg transition transform hover:-translate-y-1 active:scale-95">
                    Create Admin Account
                </button>
            </form>
            <div class="mt-6 text-center">
                <a href="admin.html" class="text-sm font-bold text-[#F5A623] hover:underline">Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const feedback = document.getElementById('feedback');

            btn.disabled = true;
            btn.innerText = 'Creating account...';
            feedback.classList.add('hidden');

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    feedback.className = 'block text-xs font-bold p-3 rounded-lg text-center bg-green-50 text-green-600 border border-green-100';
                    feedback.innerText = 'Success! You can now log in.';
                    feedback.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'admin.html', 2000);
                } else {
                    throw new Error(data.error || 'Failed to create account');
                }
            } catch (err) {
                feedback.className = 'block text-xs font-bold p-3 rounded-lg text-center bg-red-50 text-red-600 border border-red-100';
                feedback.innerText = err.message;
                feedback.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = 'Create Admin Account';
            }
        });
    </script>
</body>
</html>
